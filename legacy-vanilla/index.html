<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>drawo — Whiteboard</title>
  <link rel="stylesheet" href="style.css">
  <script src="rough.js"></script>
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="top-header">
      <div class="brand-section">
        <svg class="brand-logo" viewBox="0 0 24 24">
          <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/>
        </svg>
        <span class="brand-title">drawo</span>
        <span class="brand-badge">Hand-Drawn Whiteboard</span>
      </div>

      <div class="top-actions">
        <button class="btn-action btn-demo" id="btnLoadDemo" title="Load the Drawo Welcome Demo">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="5 3 19 12 5 21 5 3"></polygon>
          </svg>
          Welcome Demo
        </button>
        <button class="btn-action" id="btnExportPng" title="Export canvas to PNG">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          Export PNG
        </button>
        <button class="btn-action" id="btnClear" title="Clear canvas">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          </svg>
          Clear
        </button>
      </div>
    </header>

    <!-- Toolbar -->
    <nav class="toolbar-container" id="toolbar">
      <button class="tool-button" data-tool="hand" title="Hand (Panning tool) — H">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 11V6a2 2 0 0 0-4 0v5M14 10V4a2 2 0 0 0-4 0v7M10 10.5V6a2 2 0 0 0-4 0v8M10 18a6 6 0 0 0 10-4.5V11a2 2 0 0 0-4 0"></path>
        </svg>
        <span class="tool-key">H</span>
      </button>

      <button class="tool-button active" data-tool="selection" title="Selection — V">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 3l7 18 3-7 7-3L3 3z"></path>
          <path d="M13 13l6 6"></path>
        </svg>
        <span class="tool-key">V</span>
      </button>

      <div class="toolbar-divider"></div>

      <button class="tool-button" data-tool="rectangle" title="Rectangle — R">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2"></rect>
        </svg>
        <span class="tool-key">R</span>
      </button>

      <button class="tool-button" data-tool="diamond" title="Diamond — D">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="12 2 22 12 12 22 2 12"></polygon>
        </svg>
        <span class="tool-key">D</span>
      </button>

      <button class="tool-button" data-tool="ellipse" title="Ellipse — O">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
        </svg>
        <span class="tool-key">O</span>
      </button>

      <button class="tool-button" data-tool="arrow" title="Arrow (Snaps and binds to shapes!) — A">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
        <span class="tool-key">A</span>
      </button>

      <button class="tool-button" data-tool="line" title="Line — L">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="4" y1="20" x2="20" y2="4"></line>
        </svg>
        <span class="tool-key">L</span>
      </button>

      <button class="tool-button" data-tool="text" title="Text — T">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="4 7 4 4 20 4 20 7"></polyline>
          <line x1="9" y1="20" x2="15" y2="20"></line>
          <line x1="12" y1="4" x2="12" y2="20"></line>
        </svg>
        <span class="tool-key">T</span>
      </button>

      <button class="tool-button" data-tool="stickynote" title="Sticky Note — N">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h9l6-6V5a2 2 0 0 0-2-2z"></path>
          <polyline points="14 21 14 15 20 15"></polyline>
        </svg>
        <span class="tool-key">N</span>
      </button>

      <div class="toolbar-divider"></div>

      <button class="tool-button" data-tool="eraser" title="Eraser — E">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="m18 13.3-6.3-6.3a2 2 0 0 0-2.8 0L2.3 13.6a2 2 0 0 0 0 2.8l3.3 3.3a2 2 0 0 0 2.8 0L20 8.1"></path>
          <path d="M19 20H8.5"></path>
        </svg>
        <span class="tool-key">E</span>
      </button>
    </nav>

    <!-- Toolbar Action & Guide Hint (Excalidraw HintViewer style) -->
    <div class="toolbar-hint" id="toolbarHint">
      To move canvas, hold <kbd>Space</kbd> while dragging, or use the hand tool
    </div>

    <!-- Properties Panel -->
    <aside class="properties-panel" id="propertiesPanel">
      <!-- 1. Stroke / Text Color -->
      <div class="prop-group" id="groupStroke">
        <span class="prop-label" id="labelStroke">Stroke</span>
        <div class="color-palette" id="strokeColorPalette">
          <div class="color-swatch active" style="background: #1e1e1e;" data-color="#1e1e1e"></div>
          <div class="color-swatch" style="background: #e03131;" data-color="#e03131"></div>
          <div class="color-swatch" style="background: #2f9e44;" data-color="#2f9e44"></div>
          <div class="color-swatch" style="background: #1971c2;" data-color="#1971c2"></div>
          <div class="color-swatch" style="background: #f08c00;" data-color="#f08c00"></div>
          <div class="color-swatch color-custom-btn" id="customColorSwatch" title="Custom color">
            <input type="color" id="customColorPicker" value="#1e1e1e">
          </div>
        </div>
      </div>

      <!-- 2. Background Color -->
      <div class="prop-group" id="groupBackground">
        <span class="prop-label" id="labelBackground">Background</span>
        <!-- Standard palette for shapes -->
        <div class="color-palette" id="bgColorPalette">
          <div class="color-swatch active" style="background: transparent; border: 1px dashed #aaa;" data-color="transparent" title="Transparent"></div>
          <div class="color-swatch" style="background: #ffc9c9;" data-color="#ffc9c9"></div>
          <div class="color-swatch" style="background: #b2f2bb;" data-color="#b2f2bb"></div>
          <div class="color-swatch" style="background: #a5d8ff;" data-color="#a5d8ff"></div>
          <div class="color-swatch" style="background: #ffec99;" data-color="#ffec99"></div>
          <div class="color-swatch" style="background: #eebefa;" data-color="#eebefa"></div>
        </div>
        <!-- Pastel palette specifically for Sticky Notes -->
        <div class="color-palette" id="stickyColorPalette" style="display: none;">
          <div class="color-swatch active" style="background: #fff3bf;" data-color="#fff3bf" title="Pastel Yellow"></div>
          <div class="color-swatch" style="background: #ffdeeb;" data-color="#ffdeeb" title="Pastel Pink"></div>
          <div class="color-swatch" style="background: #d3f9d8;" data-color="#d3f9d8" title="Pastel Green"></div>
          <div class="color-swatch" style="background: #d0ebff;" data-color="#d0ebff" title="Pastel Blue"></div>
          <div class="color-swatch" style="background: #ffe8cc;" data-color="#ffe8cc" title="Pastel Peach"></div>
          <div class="color-swatch" style="background: #ffd43b;" data-color="#ffd43b" title="Bright Yellow"></div>
        </div>
      </div>

      <!-- 3. Stroke Width -->
      <div class="prop-group" id="groupStrokeWidth">
        <span class="prop-label">Stroke width</span>
        <div class="icon-button-group" id="strokeWidthGroup">
          <button class="icon-btn" data-val="1" title="Thin">
            <svg viewBox="0 0 24 24"><line x1="4" y1="12" x2="20" y2="12" stroke="currentColor" stroke-width="1.5"></line></svg>
          </button>
          <button class="icon-btn active" data-val="2" title="Medium">
            <svg viewBox="0 0 24 24"><line x1="4" y1="12" x2="20" y2="12" stroke="currentColor" stroke-width="3"></line></svg>
          </button>
          <button class="icon-btn" data-val="4" title="Bold">
            <svg viewBox="0 0 24 24"><line x1="4" y1="12" x2="20" y2="12" stroke="currentColor" stroke-width="4.5"></line></svg>
          </button>
        </div>
      </div>

      <!-- 4. Stroke Style -->
      <div class="prop-group" id="groupStrokeStyle">
        <span class="prop-label">Stroke style</span>
        <div class="icon-button-group" id="strokeStyleGroup">
          <button class="icon-btn active" data-val="solid" title="Solid">
            <svg viewBox="0 0 24 24"><line x1="4" y1="12" x2="20" y2="12" stroke="currentColor" stroke-width="2"></line></svg>
          </button>
          <button class="icon-btn" data-val="dashed" title="Dashed">
            <svg viewBox="0 0 24 24"><line x1="4" y1="12" x2="20" y2="12" stroke="currentColor" stroke-width="2" stroke-dasharray="4 3"></line></svg>
          </button>
          <button class="icon-btn" data-val="dotted" title="Dotted">
            <svg viewBox="0 0 24 24"><line x1="4" y1="12" x2="20" y2="12" stroke="currentColor" stroke-width="2" stroke-dasharray="1.5 3.5" stroke-linecap="round"></line></svg>
          </button>
        </div>
      </div>

      <!-- 5. Sloppiness (Roughness) -->
      <div class="prop-group" id="groupRoughness">
        <span class="prop-label">Sloppiness</span>
        <div class="icon-button-group" id="roughnessGroup">
          <button class="icon-btn" data-val="0" title="Architect">
            <svg viewBox="0 0 24 24"><path d="M4 14c4-3 12-3 16 0" fill="none" stroke="currentColor" stroke-width="2"></path></svg>
          </button>
          <button class="icon-btn active" data-val="1" title="Artist">
            <svg viewBox="0 0 24 24"><path d="M4 15c3-4 8-1 11-3s3 2 5-1" fill="none" stroke="currentColor" stroke-width="2"></path></svg>
          </button>
          <button class="icon-btn" data-val="2.5" title="Cartoonist">
            <svg viewBox="0 0 24 24"><path d="M4 14c3-4 8-1 11-3s3 2 5-1" fill="none" stroke="currentColor" stroke-width="2"></path><path d="M4 16c4-3 7 1 12-2s2 2 4-1" fill="none" stroke="currentColor" stroke-width="1.2"></path></svg>
          </button>
        </div>
      </div>

      <!-- 6. Arrow Type (for arrows) -->
      <div class="prop-group" id="groupArrowType">
        <span class="prop-label">Arrow type</span>
        <div class="icon-button-group" id="arrowTypeGroup">
          <button class="icon-btn active" data-val="straight" title="Straight arrow">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="6" y1="18" x2="18" y2="6"></line>
              <polyline points="10 6 18 6 18 14"></polyline>
            </svg>
          </button>
          <button class="icon-btn" data-val="curved" title="Curved arrow">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M6 18c0-8 6-12 12-12"></path>
              <polyline points="12 6 18 6 18 12"></polyline>
            </svg>
          </button>
          <button class="icon-btn" data-val="elbow" title="Elbow / Orthogonal arrow">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="6 18 12 18 12 6 18 6"></polyline>
              <polyline points="14 9 18 6 14 3"></polyline>
            </svg>
          </button>
        </div>
      </div>

      <!-- 7. Arrowheads (for arrows) -->
      <div class="prop-group" id="groupArrowheads">
        <span class="prop-label">Arrowheads</span>
        <div class="arrowhead-picker-container" id="arrowheadsGroup">
          <!-- Start Arrowhead -->
          <div class="arrowhead-btn-wrapper">
            <button class="arrowhead-trigger-btn" id="btnStartArrowhead" title="Start arrowhead">
              <svg width="22" height="22" viewBox="0 0 24 24"><line x1="5" y1="8" x2="11" y2="16" stroke="currentColor" stroke-width="1.8"/><line x1="11" y1="8" x2="5" y2="16" stroke="currentColor" stroke-width="1.8"/><line x1="11" y1="12" x2="21" y2="12" stroke="currentColor" stroke-width="1.8"/></svg>
            </button>
            <div class="arrowhead-popover" id="popoverStartArrowhead" style="display: none;">
              <div class="arrowhead-quick-row">
                <button class="arrowhead-opt-btn" data-head="none" title="None (q)">
                  <svg width="22" height="22" viewBox="0 0 24 24"><line x1="5" y1="8" x2="11" y2="16" stroke="currentColor" stroke-width="1.8"/><line x1="11" y1="8" x2="5" y2="16" stroke="currentColor" stroke-width="1.8"/><line x1="11" y1="12" x2="21" y2="12" stroke="currentColor" stroke-width="1.8"/></svg>
                  <span class="arrowhead-key-badge">q</span>
                </button>
                <button class="arrowhead-opt-btn" data-head="arrow" title="Arrow (w)">
                  <svg width="22" height="22" viewBox="0 0 24 24"><path d="M20 12H4M11 5L4 12l7 7" stroke="currentColor" stroke-width="1.8" fill="none"/></svg>
                  <span class="arrowhead-key-badge">w</span>
                </button>
                <button class="arrowhead-opt-btn" data-head="triangle" title="Triangle (e)">
                  <svg width="22" height="22" viewBox="0 0 24 24"><polygon points="4,12 12,6 12,18" fill="currentColor"/><line x1="12" y1="12" x2="20" y2="12" stroke="currentColor" stroke-width="1.8"/></svg>
                  <span class="arrowhead-key-badge">e</span>
                </button>
                <button class="arrowhead-opt-btn" data-head="triangle_outline" title="Triangle Outline (r)">
                  <svg width="22" height="22" viewBox="0 0 24 24"><polygon points="4,12 12,6 12,18" fill="#ffffff" stroke="currentColor" stroke-width="1.8"/><line x1="12" y1="12" x2="20" y2="12" stroke="currentColor" stroke-width="1.8"/></svg>
                  <span class="arrowhead-key-badge">r</span>
                </button>
              </div>
              <div class="arrowhead-more-toggle" id="toggleMoreStart">
                <span>More options</span>
                <span class="more-arrow">⌵</span>
              </div>
              <div class="arrowhead-more-grid" id="gridMoreStart" style="display: none;">
                <button class="arrowhead-opt-btn" data-head="circle" title="Dot / Circle">
                  <svg width="22" height="22" viewBox="0 0 24 24"><circle cx="8" cy="12" r="4" fill="currentColor"/><line x1="12" y1="12" x2="20" y2="12" stroke="currentColor" stroke-width="1.8"/></svg>
                </button>
                <button class="arrowhead-opt-btn" data-head="circle_outline" title="Circle Outline">
                  <svg width="22" height="22" viewBox="0 0 24 24"><circle cx="8" cy="12" r="4" fill="#ffffff" stroke="currentColor" stroke-width="1.8"/><line x1="12" y1="12" x2="20" y2="12" stroke="currentColor" stroke-width="1.8"/></svg>
                </button>
                <button class="arrowhead-opt-btn" data-head="bar" title="Bar">
                  <svg width="22" height="22" viewBox="0 0 24 24"><line x1="5" y1="6" x2="5" y2="18" stroke="currentColor" stroke-width="2"/><line x1="5" y1="12" x2="20" y2="12" stroke="currentColor" stroke-width="1.8"/></svg>
                </button>
                <button class="arrowhead-opt-btn" data-head="diamond" title="Diamond">
                  <svg width="22" height="22" viewBox="0 0 24 24"><polygon points="3,12 8,7 13,12 8,17" fill="currentColor"/><line x1="13" y1="12" x2="20" y2="12" stroke="currentColor" stroke-width="1.8"/></svg>
                </button>
                <button class="arrowhead-opt-btn" data-head="diamond_outline" title="Diamond Outline">
                  <svg width="22" height="22" viewBox="0 0 24 24"><polygon points="3,12 8,7 13,12 8,17" fill="#ffffff" stroke="currentColor" stroke-width="1.8"/><line x1="13" y1="12" x2="20" y2="12" stroke="currentColor" stroke-width="1.8"/></svg>
                </button>
                <button class="arrowhead-opt-btn" data-head="crowfoot_many" title="Crowfoot Many">
                  <svg width="22" height="22" viewBox="0 0 24 24"><path d="M12 6L4 12l8 6" stroke="currentColor" stroke-width="1.8" fill="none"/><line x1="4" y1="12" x2="20" y2="12" stroke="currentColor" stroke-width="1.8"/></svg>
                </button>
                <button class="arrowhead-opt-btn" data-head="crowfoot_one" title="Cardinality One">
                  <svg width="22" height="22" viewBox="0 0 24 24"><line x1="5" y1="6" x2="5" y2="18" stroke="currentColor" stroke-width="1.8"/><line x1="9" y1="6" x2="9" y2="18" stroke="currentColor" stroke-width="1.8"/><line x1="5" y1="12" x2="20" y2="12" stroke="currentColor" stroke-width="1.8"/></svg>
                </button>
                <button class="arrowhead-opt-btn" data-head="crowfoot_one_or_many" title="Cardinality One or Many">
                  <svg width="22" height="22" viewBox="0 0 24 24"><path d="M11 6L4 12l7 6" stroke="currentColor" stroke-width="1.8" fill="none"/><line x1="4" y1="12" x2="20" y2="12" stroke="currentColor" stroke-width="1.8"/><line x1="15" y1="6" x2="15" y2="18" stroke="currentColor" stroke-width="1.8"/></svg>
                </button>
              </div>
            </div>
          </div>

          <!-- End Arrowhead -->
          <div class="arrowhead-btn-wrapper">
            <button class="arrowhead-trigger-btn" id="btnEndArrowhead" title="End arrowhead">
              <svg width="22" height="22" viewBox="0 0 24 24"><path d="M4 12h16M13 5l7 7-7 7" stroke="currentColor" stroke-width="1.8" fill="none"/></svg>
            </button>
            <div class="arrowhead-popover popover-right" id="popoverEndArrowhead" style="display: none;">
              <div class="arrowhead-quick-row">
                <button class="arrowhead-opt-btn" data-head="none" title="None (q)">
                  <svg width="22" height="22" viewBox="0 0 24 24"><line x1="3" y1="12" x2="13" y2="12" stroke="currentColor" stroke-width="1.8"/><line x1="13" y1="8" x2="19" y2="16" stroke="currentColor" stroke-width="1.8"/><line x1="19" y1="8" x2="13" y2="16" stroke="currentColor" stroke-width="1.8"/></svg>
                  <span class="arrowhead-key-badge">q</span>
                </button>
                <button class="arrowhead-opt-btn" data-head="arrow" title="Arrow (w)">
                  <svg width="22" height="22" viewBox="0 0 24 24"><path d="M4 12h16M13 5l7 7-7 7" stroke="currentColor" stroke-width="1.8" fill="none"/></svg>
                  <span class="arrowhead-key-badge">w</span>
                </button>
                <button class="arrowhead-opt-btn" data-head="triangle" title="Triangle (e)">
                  <svg width="22" height="22" viewBox="0 0 24 24"><polygon points="20,12 12,6 12,18" fill="currentColor"/><line x1="4" y1="12" x2="12" y2="12" stroke="currentColor" stroke-width="1.8"/></svg>
                  <span class="arrowhead-key-badge">e</span>
                </button>
                <button class="arrowhead-opt-btn" data-head="triangle_outline" title="Triangle Outline (r)">
                  <svg width="22" height="22" viewBox="0 0 24 24"><polygon points="20,12 12,6 12,18" fill="#ffffff" stroke="currentColor" stroke-width="1.8"/><line x1="4" y1="12" x2="12" y2="12" stroke="currentColor" stroke-width="1.8"/></svg>
                  <span class="arrowhead-key-badge">r</span>
                </button>
              </div>
              <div class="arrowhead-more-toggle" id="toggleMoreEnd">
                <span>More options</span>
                <span class="more-arrow">⌵</span>
              </div>
              <div class="arrowhead-more-grid" id="gridMoreEnd" style="display: none;">
                <button class="arrowhead-opt-btn" data-head="circle" title="Dot / Circle">
                  <svg width="22" height="22" viewBox="0 0 24 24"><circle cx="16" cy="12" r="4" fill="currentColor"/><line x1="4" y1="12" x2="12" y2="12" stroke="currentColor" stroke-width="1.8"/></svg>
                </button>
                <button class="arrowhead-opt-btn" data-head="circle_outline" title="Circle Outline">
                  <svg width="22" height="22" viewBox="0 0 24 24"><circle cx="16" cy="12" r="4" fill="#ffffff" stroke="currentColor" stroke-width="1.8"/><line x1="4" y1="12" x2="12" y2="12" stroke="currentColor" stroke-width="1.8"/></svg>
                </button>
                <button class="arrowhead-opt-btn" data-head="bar" title="Bar">
                  <svg width="22" height="22" viewBox="0 0 24 24"><line x1="19" y1="6" x2="19" y2="18" stroke="currentColor" stroke-width="2"/><line x1="4" y1="12" x2="19" y2="12" stroke="currentColor" stroke-width="1.8"/></svg>
                </button>
                <button class="arrowhead-opt-btn" data-head="diamond" title="Diamond">
                  <svg width="22" height="22" viewBox="0 0 24 24"><polygon points="21,12 16,7 11,12 16,17" fill="currentColor"/><line x1="4" y1="12" x2="11" y2="12" stroke="currentColor" stroke-width="1.8"/></svg>
                </button>
                <button class="arrowhead-opt-btn" data-head="diamond_outline" title="Diamond Outline">
                  <svg width="22" height="22" viewBox="0 0 24 24"><polygon points="21,12 16,7 11,12 16,17" fill="#ffffff" stroke="currentColor" stroke-width="1.8"/><line x1="4" y1="12" x2="11" y2="12" stroke="currentColor" stroke-width="1.8"/></svg>
                </button>
                <button class="arrowhead-opt-btn" data-head="crowfoot_many" title="Crowfoot Many">
                  <svg width="22" height="22" viewBox="0 0 24 24"><path d="M12 6l8 6-8 6" stroke="currentColor" stroke-width="1.8" fill="none"/><line x1="4" y1="12" x2="20" y2="12" stroke="currentColor" stroke-width="1.8"/></svg>
                </button>
                <button class="arrowhead-opt-btn" data-head="crowfoot_one" title="Cardinality One">
                  <svg width="22" height="22" viewBox="0 0 24 24"><line x1="15" y1="6" x2="15" y2="18" stroke="currentColor" stroke-width="1.8"/><line x1="19" y1="6" x2="19" y2="18" stroke="currentColor" stroke-width="1.8"/><line x1="4" y1="12" x2="15" y2="12" stroke="currentColor" stroke-width="1.8"/></svg>
                </button>
                <button class="arrowhead-opt-btn" data-head="crowfoot_one_or_many" title="Cardinality One or Many">
                  <svg width="22" height="22" viewBox="0 0 24 24"><path d="M13 6l7 6-7 6" stroke="currentColor" stroke-width="1.8" fill="none"/><line x1="4" y1="12" x2="20" y2="12" stroke="currentColor" stroke-width="1.8"/><line x1="9" y1="6" x2="9" y2="18" stroke="currentColor" stroke-width="1.8"/></svg>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- 8. Edges (for Rectangles & Sticky Notes) -->
      <div class="prop-group" id="groupEdges">
        <span class="prop-label">Edges</span>
        <div class="icon-button-group" id="edgesGroup">
          <button class="icon-btn" data-val="sharp" title="Sharp edges">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="5" y="5" width="14" height="14"></rect>
            </svg>
          </button>
          <button class="icon-btn active" data-val="round" title="Round edges">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="5" y="5" width="14" height="14" rx="4"></rect>
            </svg>
          </button>
        </div>
      </div>

      <!-- 9. Opacity Slider -->
      <div class="prop-group" id="groupOpacity">
        <span class="prop-label">Opacity</span>
        <div class="slider-wrapper">
          <input type="range" class="opacity-slider" id="opacitySlider" min="0" max="100" value="100">
          <div class="slider-labels">
            <span>0</span>
            <span id="opacityLabel">100</span>
          </div>
        </div>
      </div>

      <!-- 10. Layers (Z-index ordering) -->
      <div class="prop-group" id="groupLayers">
        <span class="prop-label">Layers</span>
        <div class="icon-button-group" id="layersGroup">
          <button class="icon-btn" id="btnSendToBack" title="Send to back (Cmd + Shift + [)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="4" y1="20" x2="20" y2="20"></line>
              <polyline points="8 12 12 16 16 12"></polyline>
              <line x1="12" y1="4" x2="12" y2="16"></line>
            </svg>
          </button>
          <button class="icon-btn" id="btnSendBackward" title="Send backward (Cmd + [)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="8 14 12 18 16 14"></polyline>
              <line x1="12" y1="6" x2="12" y2="18"></line>
            </svg>
          </button>
          <button class="icon-btn" id="btnBringForward" title="Bring forward (Cmd + ])">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="8 10 12 6 16 10"></polyline>
              <line x1="12" y1="18" x2="12" y2="6"></line>
            </svg>
          </button>
          <button class="icon-btn" id="btnBringToFront" title="Bring to front (Cmd + Shift + ])">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="4" y1="4" x2="20" y2="4"></line>
              <polyline points="8 12 12 8 16 12"></polyline>
              <line x1="12" y1="20" x2="12" y2="8"></line>
            </svg>
          </button>
        </div>
      </div>

      <!-- 11. Actions -->
      <div class="prop-group" id="groupActions">
        <span class="prop-label">Actions</span>
        <div class="icon-button-group" id="actionsGroup">
          <button class="icon-btn" id="btnDuplicate" title="Duplicate (Cmd + D)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="9" y="9" width="13" height="13" rx="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
          </button>
          <button class="icon-btn" id="btnDelete" title="Delete (Delete / Backspace)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            </svg>
          </button>
          <button class="icon-btn" id="btnCopyJson" title="Copy as JSON to clipboard">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
              <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
            </svg>
          </button>
        </div>
      </div>
    </aside>

    <!-- Canvas layers -->
    <main class="canvas-container" id="canvasContainer">
      <canvas id="staticCanvas"></canvas>
      <canvas id="interactiveCanvas"></canvas>
      <textarea id="textEditor" spellcheck="false"></textarea>
    </main>

    <!-- Bottom Left Navigation Controls -->
    <div class="bottom-left-controls">
      <button class="zoom-btn" id="btnZoomOut" title="Zoom Out (Ctrl + -)">−</button>
      <div class="zoom-display" id="zoomDisplay" title="Click to reset zoom">100%</div>
      <button class="zoom-btn" id="btnZoomIn" title="Zoom In (Ctrl + +)">+</button>
      <div class="toolbar-divider"></div>
      <button class="undo-btn" id="btnUndo" title="Undo (Ctrl + Z)">↩</button>
      <button class="undo-btn" id="btnRedo" title="Redo (Ctrl + Y)">↪</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
